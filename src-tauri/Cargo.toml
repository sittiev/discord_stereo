[package]
name = "stereo-wizard"
version = "0.2.2"
description = "Discord stereo voice patch wizard (v3/v4/v5 goals, multi-client)"
authors = ["rafael"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stereo_wizard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# MCP bridge for agent-assisted development. Enable only in dev builds:
#   pnpm tauri dev --features dev-tools
# Never ship a release build with this feature enabled.
dev-tools = ["dep:tauri-plugin-mcp-bridge"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
md-5 = "0.10"
tauri-plugin-mcp-bridge = { version = "0.13.1", optional = true }
ureq = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
