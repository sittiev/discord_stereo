name: Discord reports

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

concurrency:
  group: discord-reports
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    name: Ingest app reports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: gate
        env:
          TOKEN: ${{ secrets.DISCORD_REPORT_TOKEN }}
          CHANNEL: ${{ secrets.DISCORD_REPORT_CHANNEL }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHANNEL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "report ingest disabled: set DISCORD_REPORT_TOKEN and DISCORD_REPORT_CHANNEL secrets" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch new reports
        if: steps.gate.outputs.enabled == 'true'
        env:
          DISCORD_REPORT_TOKEN: ${{ secrets.DISCORD_REPORT_TOKEN }}
          DISCORD_REPORT_CHANNEL: ${{ secrets.DISCORD_REPORT_CHANNEL }}
        run: node scripts/discord-reports.mjs fetch --state state/reports.json --out "$RUNNER_TEMP/reports" --apply-state > "$RUNNER_TEMP/reports.ndjson"
      - name: Build candidates from reports
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/discord-reports-process.sh "$RUNNER_TEMP/reports"
      - name: Commit report state
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if git status --porcelain state/reports.json | grep -q .; then
            git config user.name "stereo-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/reports.json
            git commit -m "chore(reports): ingest discord traces"
            if ! git push; then
              git fetch origin main
              git rebase origin/main
              git push
            fi
          fi
      - name: Upload report evidence
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discord-reports-work-${{ github.run_id }}
          path: ${{ runner.temp }}/reports-work
          retention-days: 14
          if-no-files-found: warn
