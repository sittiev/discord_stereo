name: PatchDB snapshot

on:
  push:
    branches: [main]
    paths: [patchdb/tables.json]
  workflow_dispatch:

concurrency:
  group: patchdb-json
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Attach tables.json to the patchdb release
        run: |
          gh release create patchdb --target "$GITHUB_SHA" --title "Patch DB" --notes "Automatic snapshot of every push to patchdb/tables.json. The app reads the raw main pointer; this asset exists for history and rollback." || echo "release already exists"
          gh release upload patchdb patchdb/tables.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
