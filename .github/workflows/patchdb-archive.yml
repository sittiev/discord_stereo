name: PatchDB snapshot

on:
  push:
    branches: [main]
    paths: [patchdb/tables.json]

concurrency:
  group: patchdb-json
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Adjunta tables.json na release patchdb
        run: |
          gh release create patchdb --target "$GITHUB_SHA" --title "Patch DB" --notes "Snapshot automático de cada push em patchdb/tables.json. O app lê o raw do main; este asset existe para histórico e rollback." || echo "release já existe"
          gh release upload patchdb patchdb/tables.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
