name: Divergence pipeline

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  autopatch:
    if: github.event.label.name == 'divergence-report'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Extract report from issue body
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue view "$ISSUE" --repo "$REPO" --json body --jq .body > /tmp/report.md
          python3 -c '
          import re, sys
          body = open("/tmp/report.md", encoding="utf-8").read()
          m = re.search(r"```json\n(.*?)\n```", body, re.S)
          if not m:
              sys.exit("report json fence not found (truncated or malformed issue body)")
          open("/tmp/report.json", "w", encoding="utf-8").write(m.group(1))
          '
      - name: Generate candidate table
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          cp patchdb/tables.json /tmp/head.json
          node patchdb/autopatch.mjs /tmp/report.json > /tmp/out.txt 2>/tmp/err.txt
          code=$?
          if [ "$code" = "0" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" = "3" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" --body-file /tmp/out.txt
          else
            gh issue comment "$ISSUE" --repo "$REPO" --body "autopatch failed (code $code): $(head -c 2000 /tmp/err.txt)"
          fi
          exit 0
      - name: Publish table
        if: steps.candidate.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          REPORT_ID=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/out.txt','utf8')).report_id")
          GOAL=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/out.txt','utf8')).goal")
          MD5=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/out.txt','utf8')).md5")
          if ! node scripts/discord-watch.mjs tables-differ --head /tmp/head.json --tables patchdb/tables.json; then
            gh issue comment "$ISSUE" --repo "$REPO" --body "autopatch produced no byte change (db_version only); nothing to publish."
            exit 0
          fi
          git config user.name "stereo-wizard-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patchdb/tables.json
          git commit -m "patchdb: auto table ${GOAL} ${MD5:0:12}"
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          gh issue comment "$ISSUE" --repo "$REPO" --body "Table published to \`main\` after autopatch full coverage + schema validation (${GOAL}, \`${MD5}\`, report ${REPORT_ID}). Clients pick it up on the next launch via \`db_version\`."
