name: Discord watch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run extract + candidate even without a build change"
        type: boolean
        default: false

concurrency:
  group: discord-watch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  watch:
    name: Check Discord builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.outputs.outputs.changed }}
      matrix: ${{ steps.outputs.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check
        env:
          DISCORD_WEBHOOK_UPDATES: ${{ secrets.DISCORD_WEBHOOK_UPDATES }}
          WATCH_REPORT: ${{ runner.temp }}/watch.json
        run: node scripts/discord-watch.mjs check --state state/versions.json --report "$WATCH_REPORT" --apply-state --notify
      - id: outputs
        env:
          WATCH_REPORT: ${{ runner.temp }}/watch.json
          FORCE: ${{ inputs.force }}
        run: |
          node -e '
            const fs = require("fs");
            const w = JSON.parse(fs.readFileSync(process.env.WATCH_REPORT, "utf8"));
            const changes = w.changes ?? [];
            let matrix = changes
              .filter((c) => c.source === "discord" && (c.firstRun || c.hostChanged || c.changed.length > 0))
              .map((c) => ({ platform: c.platform, channel: c.channel }));
            if (process.env.FORCE === "true" && matrix.length === 0) {
              matrix = [{ platform: "win", channel: "stable" }, { platform: "linux", channel: "stable" }];
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changes.length > 0}\nmatrix=${JSON.stringify(matrix)}\n`);
          '
      - name: Commit state
        if: steps.outputs.outputs.changed == 'true'
        run: |
          git config user.name "stereo-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/versions.json
          git commit -m "chore(watch): discord update state"
          if ! git push; then
            git fetch origin main
            git rebase origin/main
            git push
          fi

  extract:
    name: Extract ${{ matrix.build.platform }} ${{ matrix.build.channel }}
    needs: watch
    if: needs.watch.outputs.matrix != '' && needs.watch.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.watch.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Extract discord_voice.node (manifest package)
        env:
          NODE_OUT: ${{ runner.temp }}/node-out
        run: bash scripts/extract-node-manifest.sh "${{ matrix.build.platform }}" "${{ matrix.build.channel }}" "$NODE_OUT"
      - name: Upload node
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: discord-node-${{ matrix.build.platform }}-${{ matrix.build.channel }}
          path: ${{ runner.temp }}/node-out
          retention-days: 14

  build-candidate:
    name: Candidate tables
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [watch, extract]
    if: needs.extract.result == 'success'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Download extracted nodes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Build candidates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/discord-candidate.sh artifacts
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: discord-watch-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
          retention-days: 14
          if-no-files-found: warn
